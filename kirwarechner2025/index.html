
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vereinsrechner</title>
<style>
  /* Das CSS wurde beibehalten und für die neuen Features angepasst. */
  html, body {
    margin: 0; padding: 0;
    font-family: sans-serif;
    height: 100%;
    /* Du musst sicherstellen, dass 'bild1.jpg' existiert oder dies anpassen */
    background: url('bild1.jpg') no-repeat center center fixed; 
    background-size: cover;
    overflow: hidden;
  }

  header {
    background: rgba(0,0,0,0.85);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
  }

  /* ********* NEUE STYLES FÜR DEN STAND-WÄHLER ********* */
  #stand-button {
    background: rgba(255,255,255,0.1);
    border: 1px solid #fff;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    padding: 0.3rem 1rem;
    border-radius: 8px;
    transition: background 0.2s ease;
  }
  #stand-button:hover {
    background: rgba(255,255,255,0.2);
  }

  #stand-selector-overlay {
    position: fixed;
    inset: 0; /* top, right, bottom, left = 0 */
    background: rgba(10, 10, 10, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #stand-selector-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  #stand-options-container {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 80%;
    max-width: 300px;
    transform: scale(0.95);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #stand-selector-overlay.active #stand-options-container {
    transform: scale(1);
  }

  .stand-option-btn {
    padding: 1rem;
    font-size: 1.2rem;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #fff;
    color: #fff;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
    backdrop-filter: blur(3px);
  }
  .stand-option-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  .stand-option-btn.current {
    background: rgba(138, 255, 138, 0.3);
    border-color: #8aff8a;
    font-weight: bold;
  }
  /* ****************************************************** */

  h1 {
    font-size: 1rem;
    margin: 0;
  }

  .content {
    display: grid;
    /* Angepasst für 3 Kategorien */
    grid-template-rows: auto 1fr auto 1fr auto 1fr; 
    height: calc(100% - 4rem);
    padding-bottom: 7rem;
    box-sizing: border-box;
    overflow-y: auto;
  }

  .category {
    background: rgba(0,0,0,0.75);
    color: #fff;
    text-align: center;
    padding: 0.2rem;
    font-weight: bold;
    font-size: 1rem;
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 0.4rem;
    padding: 0.4rem;
  }

  button {
    background: rgba(100, 100, 100, 0.7);
    color: #fff;
    border: 1px solid #fff;
    border-radius: 12px;
    padding: 0.6rem;
    font-size: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    backdrop-filter: blur(3px);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
  }

  button:active {
    background: rgba(150, 150, 150, 0.8);
  }

  @media (hover: hover) {
    button:hover {
      background: rgba(150, 150, 150, 0.8);
    }
  }

  #footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    color: #fff;
    z-index: 10;
  }

  #cart-overlay {
    position: fixed;
    left: 0; right: 0;
    bottom: -100%;
    height: 85%;
    background: rgba(0,0,0,0.95);
    color: #fff;
    padding: 1rem;
    border-radius: 12px 12px 0 0;
    transition: bottom 0.3s ease;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }

  #cart-overlay.active {
    bottom: 0;
  }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cart-header button {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
  }

  #cart-items {
    flex: 1;
    overflow-y: auto;
    margin-top: 0.5rem;
  }

  .cart-item {
    background: rgba(255,255,255,0.1);
    margin-bottom: 0.3rem;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cart-category-header {
    background: rgba(255,255,255,0.2);
    color: #fff;
    padding: 0.3rem 0.6rem;
    margin-top: 0.8rem;
    margin-bottom: 0.3rem;
    border-radius: 4px;
    font-weight: bold;
  }

  #quantity-popup {
    position: fixed;
    top: 50%; left: 50%;
    background: rgba(0,0,0,0.95);
    padding: 1rem;
    border-radius: 8px;
    color: #fff;
    z-index: 999;
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease-out;
    pointer-events: none;
    box-shadow: 0 5px 20px rgba(0,0,0,0.7);
  }

  #quantity-popup.active {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  
  .close-popup-btn {
      position: absolute;
      top: 0.3rem;
      right: 0.3rem;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
  }
  .close-popup-btn:hover {
      opacity: 1;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
  }


  .quantity-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0.5rem 0;
    gap: 1.2rem;
  }

  .quantity-controls button {
    background: rgba(150, 150, 150, 0.8);
    color: #fff;
    border: 1px solid #fff;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    font-size: 1.4rem;
    cursor: pointer;
  }

  .quantity-controls span {
    font-size: 1.4rem;
    font-weight: bold;
  }

  @media (orientation: portrait) {
    .button-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (orientation: landscape) {
    .button-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  #cart-overlay .cart-footer { 
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 0.5rem;
    border-top: 1px solid rgba(255,255,255,0.2);
    margin-top: 0.5rem;
    position: relative; 
  }

  #cart-overlay #calculate-button {
    background: rgba(50, 150, 50, 0.8); 
    border: 1px solid #fff;
    color: #fff;
    border-radius: 12px;
    padding: 0.6rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
  }

  #cart-overlay #calculate-button:active {
    background: rgba(70, 170, 70, 0.9);
  }

  @media (hover: hover) {
    #cart-overlay #calculate-button:hover {
      background: rgba(70, 170, 70, 0.9);
    }
  }

  #add-misc-item-button {
    background: rgba(100, 100, 200, 0.8); 
    border: 1px solid #fff;
    color: #fff;
    border-radius: 50%; 
    width: 3.5rem; 
    height: 3.5rem; 
    font-size: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease, transform 0.2s ease;
    position: absolute; 
    left: 50%;
    transform: translateX(-50%);
    bottom: 0.5rem; 
    z-index: 10;
  }

  #add-misc-item-button:active {
    background: rgba(120, 120, 220, 0.9);
    transform: translateX(-50%) scale(0.95);
  }

  @media (hover: hover) {
    #add-misc-item-button:hover {
      background: rgba(120, 120, 220, 0.9);
    }
  }


  #calculator-overlay {
    position: fixed;
    left: 0; right: 0;
    bottom: -100%;
    height: 85%;
    background: rgba(0,0,0,0.98);
    color: #fff;
    padding: 1rem;
    border-radius: 12px 12px 0 0;
    transition: bottom 0.3s ease;
    display: flex;
    flex-direction: column;
    z-index: 101;
  }

  #calculator-overlay.active {
    bottom: 0;
  }

  .calculator-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }

  .calculator-header h2 {
    margin: 0;
  }

  .calculator-header button {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
  }

  .calculator-display {
    background: rgba(255,255,255,0.1);
    padding: 0.8rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 1.5rem;
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .calculator-display div {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .calculator-display .label {
    font-size: 0.9em;
    opacity: 0.7;
  }

  .calculator-display #received-amount-display {
    font-weight: bold;
    color: #8aff8a; 
  }

  .calculator-display #cart-total-calc {
    font-weight: bold;
    color: #ffda8a;
  }

  .calculator-display #change-due {
    font-weight: bold;
    font-size: 1.8rem;
    color: #fff; 
  }
  
  .calculator-numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    flex-grow: 1;
  }

  .calculator-numpad button {
    background: rgba(100, 100, 100, 0.7);
    color: #fff;
    border: 1px solid #fff;
    border-radius: 12px;
    padding: 1rem;
    font-size: 1.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    backdrop-filter: blur(3px);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease;
  }

  .calculator-numpad button:active {
    background: rgba(150, 150, 150, 0.8);
  }

  .calculator-numpad button.clear {
    background: rgba(200, 50, 50, 0.7); 
  }
  .calculator-numpad button.clear:active {
    background: rgba(220, 70, 70, 0.8);
  }

  /* ********* STYLES FÜR DAS MANUELLE HINZUFÜGEN - ÜBERARBEITET ********* */
  #manual-add-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    background: rgba(0,0,0,0.95);
    padding: 1rem;
    padding-top: 3rem; /* Extra Platz für den Schließen-Button */
    border-radius: 8px;
    color: #fff;
    z-index: 102;
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease-out;
    pointer-events: none;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    box-sizing: border-box;
  }

  #manual-add-popup.active {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  
  #manual-add-popup input[type="text"],
  #manual-add-popup input[type="number"] {
    width: 100%;
    padding: 0.8rem;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1.1rem;
    outline: none;
    transition: border-color 0.2s ease;
    box-sizing: border-box;
  }

  #manual-add-popup input[type="text"]:focus,
  #manual-add-popup input[type="number"]:focus {
    border-color: #8aff8a;
  }

  #manual-add-popup button.add-item-btn {
    width: 100%;
    padding: 0.8rem;
    background: rgba(50, 150, 50, 0.8);
    border: 1px solid #fff;
    border-radius: 12px;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  #manual-add-popup button.add-item-btn:active {
    background: rgba(70, 170, 70, 0.9);
  }
  @media (hover: hover) {
    #manual-add-popup button.add-item-btn:hover {
      background: rgba(70, 170, 70, 0.9);
    }
  }

</style>
</head>
<body>

<header>
  <button onclick="openStandSelector()" aria-label="Stand wählen" id="stand-button">Ausschank &#9662;</button>
  <button onclick="resetCart()" aria-label="Warenkorb leeren">🗑️</button>
</header>

<div class="content">
  <div class="category" id="getraenke-category">Getränke</div>
  <div class="button-grid" id="getraenke-buttons"></div>

  <div class="category" id="essen-category">Essen</div>
  <div class="button-grid" id="essen-buttons"></div>

  <div class="category" id="pfand-category">Pfand</div>
  <div class="button-grid" id="pfand-buttons"></div>
</div>

<div id="footer">
  <div id="cart-total">Gesamt: 0,00€</div>
  <button onclick="toggleCart()" aria-label="Warenkorb anzeigen">🛒 Warenkorb</button>
</div>

<div id="stand-selector-overlay" onclick="closeStandSelector(event)">
  <div id="stand-options-container">
    </div>
</div>

<div id="cart-overlay" role="dialog" aria-modal="true" aria-labelledby="cart-title" tabindex="-1">
  <div class="cart-header">
    <h2 id="cart-title">🛒 Warenkorb</h2>
    <button onclick="toggleCart()" aria-label="Warenkorb schließen">✖️</button>
  </div>
  <div id="cart-items" tabindex="0" aria-live="polite"></div>
  <div class="cart-footer">
    <div id="cart-total-line">Gesamt: 0,00€</div>
    <button id="add-misc-item-button" onclick="openManualAddPopup()" aria-label="Manuelles Produkt hinzufügen">+</button>
    <button id="calculate-button" onclick="openCalculator()" aria-label="Kasse öffnen">Berechnen</button>
  </div>
</div>

<div id="quantity-popup" role="dialog" aria-modal="true" aria-labelledby="quantity-text" tabindex="-1">
  <button class="close-popup-btn" onclick="closeQuantityPopup()" aria-label="Schließen">&times;</button>
  <p id="quantity-text"></p>
  <div class="quantity-controls">
    <button onclick="adjustQuantity(-1)" aria-label="Menge verringern">−</button>
    <span id="quantity-count" aria-live="polite">1</span>
    <button onclick="adjustQuantity(1)" aria-label="Menge erhöhen">+</button>
  </div>
  <button onclick="confirmQuantity()">Hinzufügen</button>
</div>

<div id="calculator-overlay" role="dialog" aria-modal="true" aria-labelledby="calculator-title" tabindex="-1">
  <div class="calculator-header">
    <h2 id="calculator-title">Kassenrechner</h2>
    <button onclick="closeCalculator()" aria-label="Rechner schließen">✖️</button>
  </div>
  <div class="calculator-display">
    <div>
      <span class="label">Gegeben:</span>
      <span id="received-amount-display">0,00€</span>
    </div>
    <div>
      <span class="label">Summe:</span>
      <span id="cart-total-calc">0,00€</span>
    </div>
    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.3); margin: 0.5rem 0;">
    <div>
      <span class="label">Wechselgeld:</span>
      <span id="change-due">0,00€</span>
    </div>
  </div>
  <div class="calculator-numpad">
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="appendNumber('.')">.</button>
    <button onclick="appendNumber('0')">0</button>
    <button onclick="clearReceivedAmount()" class="clear">C</button>
  </div>
</div>

<div id="manual-add-popup" role="dialog" aria-modal="true" tabindex="-1">
    <button class="close-popup-btn" onclick="closeManualAddPopup()" aria-label="Schließen">&times;</button>
    <input type="text" id="manual-product-name" placeholder="Produktname (optional)" value="Sonstiges">
    <input type="number" id="manual-product-price" placeholder="Preis (€)" step="0.01" value="" inputmode="decimal">
    <button onclick="addManualItem()" class="add-item-btn">Hinzufügen</button>
</div>

<script>
// STANDS-DEFINITION
const stands = ['Ausschank', 'Bar', 'Aperolstand', 'Essen'];
let currentStand = 'Ausschank'; // Standardstand
let total = 0;
let cart = {};  
let quantityItem = null;  
let quantityCount = 1;

// ********* Variablen für den Rechner *********
let receivedAmount = ''; // Speichert die eingegebene Zahl als String

// PRODUKT-DEFINITIONEN (ohne Fackel)
const products = {
  Ausschank: {
    getraenke: [
      ['Bier', 4.00, 3], // 4€ + 3€ Pfand = 7€ Endpreis
      ['Weizen', 4.00, 3],
      ['alkoholfreies Bier', 4.00, 3],
      ['Maß', 7.50, 3],
      ['Goaßmaß', 10.00, 3],
      ['Goaßhalbe', 5.50, 3],
      ['Pils', 3.00, 1], // 3€ + 1€ Pfand = 4€ Endpreis
      ['Limo/Spezi/Wasser', 3.00, 1]
    ],
    essen: [],
    pfand: [
      ['Flasche zurück', -1],
      ['Krug zurück', -3]
    ]
  },
  Bar: {
    getraenke: [
      ['Gemischte', 3.50, 1], // 3.50€ + 1€ Pfand = 4.50€ Endpreis
      ['Kriechenbauer Schnaps', 3.50, 3], // 3.50€ + 3€ Pfand = 6.50€ Endpreis
      ['Shots', 2.00], // Kein Pfand
      ['Kukki', 6.00, 1],
      ['Desperados', 4.00, 1]
    ],
    essen: [],
    pfand: [
      ['Becher oder Flasche zurück', -1],
      ['Kriechenbauer Glas zurück', -3]
    ]
  },
  Aperolstand: {
    getraenke: [
        ['Glas Wein', 4.00, 3], // 4€ + 3€ Pfand = 7€ Endpreis
        ['Weinschorle', 3.50, 3],
        ['Flasche Wein', 11.00], // Kein Pfand
        ['Aperitif', 6.00, 3]
    ],
    essen: [],
    pfand: [
        ['Glas zurück', -3]
    ]
  },
  Essen: {
    getraenke: [],
    essen: [
      ['Bratwurstsemmel', 3.50],
      ['Steaksemmel', 4.50],
      ['Breze mit Käse', 4.50],
      ['Breze', 2.50],
      ['Currywurst mit Pommes', 6.50],
      ['Portion Pommes', 3.50]
    ],
    pfand: []
  }
};

function formatPrice(price) {
  return (price < 0 ? '−' : '') + Math.abs(price).toFixed(2).replace('.', ',') + '€';
}

// ********* NEUE FUNKTIONEN FÜR DEN STAND-WÄHLER *********
function openStandSelector() {
    const overlay = document.getElementById('stand-selector-overlay');
    const container = document.getElementById('stand-options-container');
    container.innerHTML = ''; // Alte Buttons entfernen
    
    stands.forEach(stand => {
        const btn = document.createElement('button');
        btn.textContent = stand;
        btn.className = 'stand-option-btn';
        if (stand === currentStand) {
            btn.classList.add('current');
        }
        btn.onclick = (e) => {
            e.stopPropagation(); // Verhindert, dass das Overlay sofort wieder schließt
            selectStand(stand);
        };
        container.appendChild(btn);
    });
    
    overlay.classList.add('active');
}

function closeStandSelector(event) {
    const overlay = document.getElementById('stand-selector-overlay');
    // Schließt das Menü nur, wenn auf den Hintergrund geklickt wird
    if (event.target === overlay) {
        overlay.classList.remove('active');
    }
}

function selectStand(stand) {
  currentStand = stand;
  const button = document.getElementById('stand-button');
  button.innerHTML = `${stand} &#9662;`; // Aktualisiert den Header-Button
  document.getElementById('stand-selector-overlay').classList.remove('active');
  
  resetCart();
  closeQuantityPopup();  
  renderButtons();
}
// ******************************************************

function renderButtons() {
  const grids = {
    getraenke: document.getElementById('getraenke-buttons'),
    essen: document.getElementById('essen-buttons'),
    pfand: document.getElementById('pfand-buttons')
  };

  Object.values(grids).forEach(grid => grid.innerHTML = '');

  const data = products[currentStand];
  const categoryKeysInOrder = ['getraenke', 'essen', 'pfand']; 

  categoryKeysInOrder.forEach(categoryKey => {
    const categoryData = data[categoryKey];
    const categoryDiv = document.getElementById(`${categoryKey}-category`);
    const gridDiv = grids[categoryKey];
    
    if (categoryData && categoryData.length > 0) {
        categoryDiv.style.display = '';
        gridDiv.style.display = 'grid';

        categoryData.forEach(itemData => {
          const [name, price, deposit] = itemData;
          let finalPrice = price;
          let finalName = name;
          let isPfandButton = categoryKey === 'pfand'; 

          if (categoryKey === 'getraenke' && deposit && deposit > 0) {
              finalPrice = price + deposit;
              finalName = `${name} (inkl. Pfand)`;
          }

          const btn = document.createElement('button');
          if (categoryKey === 'essen' || isPfandButton) {
            // Direktes Hinzufügen für Essen und Pfand
            btn.innerHTML = `${name} ${formatPrice(price)}`;
            btn.onclick = () => addItem(finalName, finalPrice, categoryKey);
          } else {
            // Mengenauswahl für Getränke
            btn.innerHTML = `${name} ${formatPrice(price)}`;
            btn.onclick = () => promptQuantity(finalName, finalPrice, categoryKey);
          }
          gridDiv.appendChild(btn);
        });
    } else {
        categoryDiv.style.display = 'none';
        gridDiv.style.display = 'none';
    }
  });
}

function promptQuantity(name, price, category) {
  quantityItem = { name, price, category };
  quantityCount = 1;
  updateQuantityPopupDisplay();
  document.getElementById('quantity-popup').classList.add('active');
}

function closeQuantityPopup() {
    document.getElementById('quantity-popup').classList.remove('active');
}

function adjustQuantity(change) {
  quantityCount = Math.max(1, quantityCount + change);
  updateQuantityPopupDisplay();
}

function updateQuantityPopupDisplay() {
    const quantityCountSpan = document.getElementById('quantity-count');
    const quantityTextP = document.getElementById('quantity-text');

    quantityCountSpan.innerText = quantityCount;

    const totalItemPrice = quantityItem.price * quantityCount;
    quantityTextP.innerText = `${quantityItem.name} (${quantityCount}x): ${formatPrice(totalItemPrice)}`;
}


function confirmQuantity() {
    for (let i = 0; i < quantityCount; i++) {
        addItem(quantityItem.name, quantityItem.price, quantityItem.category);
    }
    closeQuantityPopup();
}

function addItem(name, price, category) {
  total += price;
  if (!cart[name]) {
    cart[name] = { qty: 0, price: 0, category: category };
  }
  
  cart[name].qty++;
  cart[name].price += price;

  renderCart();
  if (document.getElementById('calculator-overlay').classList.contains('active')) {
      updateCalculatorDisplay();
  }
}

function removeItem(name) {
  if (!cart[name]) return;

  let itemPricePerUnit = cart[name].price / cart[name].qty;
  total -= itemPricePerUnit;
  cart[name].qty--;
  cart[name].price -= itemPricePerUnit;
  if (cart[name].qty <= 0) {
      delete cart[name];
  }
  
  renderCart();
  if (document.getElementById('calculator-overlay').classList.contains('active')) {
      updateCalculatorDisplay();
  }
}

function resetCart() {
  cart = {};
  total = 0;
  renderCart();
  document.getElementById('cart-overlay').classList.remove('active');
  document.getElementById('calculator-overlay').classList.remove('active');
  resetCalculator();  
}

function toggleCart() {
  document.getElementById('cart-overlay').classList.toggle('active');
  if (document.getElementById('cart-overlay').classList.contains('active')) {
      closeCalculator();
      closeManualAddPopup();
  }
}

function renderCart() {
  const cartItemsContainer = document.getElementById('cart-items');
  cartItemsContainer.innerHTML = '';

  const categoryOrder = ['getraenke', 'essen', 'pfand', 'sonstiges'];
  const categoryNames = {
      getraenke: 'Getränke',
      essen: 'Essen',
      pfand: 'Pfand',
      sonstiges: 'Sonstiges'  
  };

  const groupedCart = {};
  categoryOrder.forEach(cat => groupedCart[cat] = []);

  for (const itemName in cart) {
    if (cart.hasOwnProperty(itemName)) {
      const item = cart[itemName];
      if (groupedCart[item.category]) {
        groupedCart[item.category].push({ name: itemName, ...item });
      }
    }
  }

  categoryOrder.forEach(categoryKey => {
    const itemsInThisCategory = groupedCart[categoryKey];
    if (itemsInThisCategory.length > 0) {
      const categoryHeader = document.createElement('div');
      categoryHeader.className = 'cart-category-header';
      categoryHeader.textContent = categoryNames[categoryKey];
      cartItemsContainer.appendChild(categoryHeader);

      itemsInThisCategory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        
        let displayText = `<span>${item.name} (${item.qty}x): ${formatPrice(item.price)}</span>`;
        div.innerHTML = `${displayText} <button onclick="removeItem('${item.name.replace(/'/g, "\\'")}')">🗑️</button>`;
        cartItemsContainer.appendChild(div);
      });
    }
  });

  document.getElementById('cart-total').innerText = `Gesamt: ${formatPrice(total)}`;
  document.getElementById('cart-total-line').innerText = `Gesamt: ${formatPrice(total)}`;
}

function openCalculator() {
    document.getElementById('calculator-overlay').classList.add('active');
    updateCalculatorDisplay();
    closeManualAddPopup();
}

function closeCalculator() {
    document.getElementById('calculator-overlay').classList.remove('active');
    resetCalculator();
}

function updateCalculatorDisplay() {
    const receivedDisplay = document.getElementById('received-amount-display');
    const cartTotalDisplay = document.getElementById('cart-total-calc');
    const changeDueDisplay = document.getElementById('change-due');

    const receivedNum = parseFloat(receivedAmount || '0');  
    receivedDisplay.innerText = formatPrice(receivedNum);

    cartTotalDisplay.innerText = formatPrice(total);

    const change = receivedNum - total;
    changeDueDisplay.innerText = formatPrice(change);

    if (change < 0) {
        changeDueDisplay.style.color = '#ff8a8a';  
    } else if (change > 0) {
        changeDueDisplay.style.color = '#8aff8a';  
    } else {
        changeDueDisplay.style.color = '#fff';  
    }
}

function appendNumber(num) {
    if (num === '.' && receivedAmount.includes('.')) {
        return;
    }
    if (receivedAmount === '' && num === '.') {
        receivedAmount = '0.';
    } else if (receivedAmount === '0' && num !== '.') {
        receivedAmount = num;
    }
    else {
        receivedAmount += num;
    }
    
    const parts = receivedAmount.split('.');
    if (parts.length > 1 && parts[1].length > 2) {
        receivedAmount = parts[0] + '.' + parts[1].substring(0, 2);
    }
    updateCalculatorDisplay();
}

function clearReceivedAmount() {
    receivedAmount = '';
    updateCalculatorDisplay();
}

function resetCalculator() {
    receivedAmount = '';
    updateCalculatorDisplay();
}

// ********* FUNKTIONEN FÜR MANUELLES HINZUFÜGEN - ÜBERARBEITET *********
function openManualAddPopup() {
    document.getElementById('manual-add-popup').classList.add('active');
    document.getElementById('manual-product-name').value = 'Sonstiges';
    document.getElementById('manual-product-price').value = '';
    closeCalculator();
}

function closeManualAddPopup() {
    document.getElementById('manual-add-popup').classList.remove('active');
}

function addManualItem() {
    let name = document.getElementById('manual-product-name').value.trim();
    let price = parseFloat(document.getElementById('manual-product-price').value);

    if (name === '') {
        name = 'Sonstiges';
    }

    if (isNaN(price) || price <= 0) {
        alert('Bitte geben Sie einen gültigen Preis ein.');
        return;
    }

    addItem(name, price, 'sonstiges');
    closeManualAddPopup();
}

// Initial render when the page loads
renderButtons();
</script>
